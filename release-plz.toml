# Only the touchcue package is versioned and tagged. Nothing is published to
# a cargo registry, and release.yml creates the GitHub release from the tag.
[workspace]
git_only = true
publish = false
git_release_enable = false
git_tag_enable = false
# Library crates look up and link the touchcue release tag; they never create tags.
git_tag_name = "v{{ version }}"
release = false
release_always = false
semver_check = false
pr_labels = ["release"]

[[package]]
name = "touchcue"
release = true
changelog_path = "CHANGELOG.md"
git_tag_enable = true
git_tag_name = "v{{ version }}"
changelog_update = true
changelog_include = [
  "touchcue-core",
  "touchcue-detect",
  "touchcue-appinfo",
  "touchcue-ui",
  "touchcue-ipc",
  "touchcue-hooks",
  "touchcue-helper",
]

# Library crates keep their own CHANGELOG.md and also feed the touchcue
# changelog; the workspace settings keep them untagged and unpublished.
[[package]]
name = "touchcue-core"
release = true

[[package]]
name = "touchcue-detect"
release = true

[[package]]
name = "touchcue-appinfo"
release = true

[[package]]
name = "touchcue-ui"
release = true

[[package]]
name = "touchcue-ipc"
release = true

[[package]]
name = "touchcue-hooks"
release = true

[[package]]
name = "touchcue-helper"
release = true
