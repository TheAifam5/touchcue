[spec]
"Shows who is waiting for your security key touch" = "Pokazuje, która aplikacja czeka na dotknięcie klucza bezpieczeństwa"
"Configuration file [default: $XDG_CONFIG_HOME/touchcue/config.toml]" = "Plik konfiguracji [domyślnie: $XDG_CONFIG_HOME/touchcue/config.toml]"
"Log more: -v for info, -vv for debug; TOUCHCUE_LOG overrides it" = "Więcej szczegółów w dzienniku: -v dla info, -vv dla debug; TOUCHCUE_LOG ma pierwszeństwo"
"Print help" = "Wyświetl pomoc"
"Print version" = "Wyświetl wersję"
"Run the daemon in the foreground" = "Uruchom demona na pierwszym planie"
"Check the configuration, desktop capabilities and devices" = "Sprawdź konfigurację, możliwości środowiska graficznego i urządzenia"
"List the connected FIDO devices" = "Wyświetl podłączone urządzenia FIDO"
"Print touch detection signals until interrupted" = "Wyświetlaj sygnały wykrywania dotyku do przerwania działania"
"Set up touch detection for gpg and ssh through gpg-agent" = "Skonfiguruj wykrywanie dotyku dla gpg i ssh za pośrednictwem gpg-agent"
"Make gpg-agent run touchcue as its scdaemon" = "Skonfiguruj gpg-agent tak, aby uruchamiał touchcue jako scdaemon"
"Stop gpg-agent from running touchcue as its scdaemon" = "Wyłącz uruchamianie touchcue jako scdaemon przez gpg-agent"
"Replace gpg-agent.conf with the backup taken by install, then delete the backup" = "Zastąp gpg-agent.conf kopią zapasową utworzoną przez install, a następnie usuń kopię"
"Answer an OpenSSH askpass prompt" = "Odpowiedz na żądanie askpass z OpenSSH"
"Answer an OpenSSH askpass prompt\n\nOpenSSH runs the `SSH_ASKPASS` program with no extra arguments, so point it at a link to touchcue named `touchcue-askpass`. `touchcue askpass` passes every argument after it through unparsed." = "Odpowiedz na żądanie askpass z OpenSSH\n\nOpenSSH uruchamia program `SSH_ASKPASS` bez dodatkowych argumentów. Wskaż więc dowiązanie do touchcue o nazwie `touchcue-askpass`. `touchcue askpass` przekazuje wszystkie następujące po nim argumenty bez ich interpretowania."
"The prompt OpenSSH passes" = "Treść żądania przekazana przez OpenSSH"
"Run gpg-agent's pinentry and report whom its PIN dialogs serve" = "Uruchom pinentry dla gpg-agent i wskaż, której aplikacji dotyczą okna wprowadzania kodu PIN"
"Run gpg-agent's pinentry and report whom its PIN dialogs serve\n\nSet `pinentry-program` in gpg-agent.conf to a link to touchcue named `touchcue-pinentry`. The real pinentry is `$TOUCHCUE_PINENTRY` or `pinentry` on `PATH`. `touchcue pinentry` forwards its arguments unparsed; `pinentry` must be the first argument, with no global option before it." = "Uruchom pinentry dla gpg-agent i wskaż, której aplikacji dotyczą okna wprowadzania kodu PIN\n\nUstaw `pinentry-program` w gpg-agent.conf na dowiązanie do touchcue o nazwie `touchcue-pinentry`. Właściwy program pinentry to `$TOUCHCUE_PINENTRY` lub `pinentry` znaleziony w `PATH`. `touchcue pinentry` przekazuje argumenty bez ich interpretowania; `pinentry` musi być pierwszym argumentem, bez poprzedzających go opcji globalnych."
"Arguments for the real pinentry" = "Argumenty dla właściwego programu pinentry"

