[spec]
"Shows who is waiting for your security key touch" = "Zeigt an, welche Anwendung auf die Berührung Ihres Sicherheitsschlüssels wartet"
"Configuration file [default: $XDG_CONFIG_HOME/touchcue/config.toml]" = "Konfigurationsdatei [Standard: $XDG_CONFIG_HOME/touchcue/config.toml]"
"Log more: -v for info, -vv for debug; TOUCHCUE_LOG overrides it" = "Ausführlicher protokollieren: -v für info, -vv für debug; TOUCHCUE_LOG hat Vorrang"
"Print help" = "Hilfe anzeigen"
"Print version" = "Version anzeigen"
"Run the daemon in the foreground" = "Den Daemon im Vordergrund ausführen"
"Check the configuration, desktop capabilities and devices" = "Konfiguration, Funktionen der Desktop-Umgebung und Geräte prüfen"
"List the connected FIDO devices" = "Angeschlossene FIDO-Geräte auflisten"
"Print touch detection signals until interrupted" = "Signale der Berührungserkennung bis zum Abbruch ausgeben"
"Set up touch detection for gpg and ssh through gpg-agent" = "Berührungserkennung für gpg und ssh über gpg-agent einrichten"
"Make gpg-agent run touchcue as its scdaemon" = "gpg-agent so einrichten, dass touchcue als scdaemon ausgeführt wird"
"Stop gpg-agent from running touchcue as its scdaemon" = "touchcue nicht mehr als scdaemon von gpg-agent ausführen"
"Replace gpg-agent.conf with the backup taken by install, then delete the backup" = "gpg-agent.conf durch die von install angelegte Sicherung ersetzen und die Sicherung anschließend löschen"
"Answer an OpenSSH askpass prompt" = "Eine askpass-Anfrage von OpenSSH beantworten"
"Answer an OpenSSH askpass prompt\n\nOpenSSH runs the `SSH_ASKPASS` program with no extra arguments, so point it at a link to touchcue named `touchcue-askpass`. `touchcue askpass` passes every argument after it through unparsed." = "Eine askpass-Anfrage von OpenSSH beantworten\n\nOpenSSH ruft das Programm `SSH_ASKPASS` ohne zusätzliche Argumente auf. Verweisen Sie daher auf einen Link auf touchcue mit dem Namen `touchcue-askpass`. `touchcue askpass` reicht alle nachfolgenden Argumente unverändert weiter."
"The prompt OpenSSH passes" = "Der von OpenSSH übergebene Aufforderungstext"
"Run gpg-agent's pinentry and report whom its PIN dialogs serve" = "pinentry für gpg-agent ausführen und anzeigen, zu welcher Anwendung die PIN-Dialoge gehören"
"Run gpg-agent's pinentry and report whom its PIN dialogs serve\n\nSet `pinentry-program` in gpg-agent.conf to a link to touchcue named `touchcue-pinentry`. The real pinentry is `$TOUCHCUE_PINENTRY` or `pinentry` on `PATH`. `touchcue pinentry` forwards its arguments unparsed; `pinentry` must be the first argument, with no global option before it." = "pinentry für gpg-agent ausführen und anzeigen, zu welcher Anwendung die PIN-Dialoge gehören\n\nSetzen Sie `pinentry-program` in gpg-agent.conf auf einen Link auf touchcue mit dem Namen `touchcue-pinentry`. Das eigentliche pinentry-Programm ist `$TOUCHCUE_PINENTRY` oder `pinentry` aus `PATH`. `touchcue pinentry` reicht seine Argumente unverändert weiter; `pinentry` muss das erste Argument sein, ohne vorangestellte globale Option."
"Arguments for the real pinentry" = "Argumente für das eigentliche pinentry-Programm"

