name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - mise.toml
      - touchcue.usage.kdl
  workflow_dispatch:

permissions: {}

# One deployment at a time; a deployment in progress is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Tools outside a job's install_args stay uninstalled: auto-install would
  # fetch them unauthenticated and can hit the GitHub API rate limit.
  MISE_AUTO_INSTALL: "false"
  MISE_GITHUB_TOKEN: ${{ github.token }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.2
          install_args: node
      - name: Build with VitePress
        run: |
          mise run docs:build
          touch docs/.vitepress/dist/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the site to GitHub Pages
      id-token: write # deploy-pages verifies the deployment origin with OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
