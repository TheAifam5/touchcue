# yaml-language-server: $schema=https://www.schemastore.org/github-issue-forms.json
name: Device or app support report
description: Report how a device or application behaves with touchcue.
labels: [device-support]
body:
  - type: dropdown
    id: device-type
    attributes:
      label: Device type
      options:
        - FIDO2/U2F key
        - OpenPGP card
        - PIV
        - YubiKey OTP/HMAC
        - OATH
        - fingerprint reader
        - Trezor
        - Ledger
        - other
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and firmware
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - USB
        - NFC
        - Bluetooth
        - other
  - type: input
    id: version
    attributes:
      label: touchcue version
      description: Output of `touchcue --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop or compositor and session type
      description: For example Hyprland on Wayland.
  - type: textarea
    id: application
    attributes:
      label: Requesting application and action
      description: The application that asked for the touch and what you did in it.
  - type: textarea
    id: check
    attributes:
      label: "`touchcue check` output"
      description: |
        This command is not implemented yet in early versions.
        Redact device serials, PINs and personal paths before posting.
      render: text
  - type: textarea
    id: trace
    attributes:
      label: "`touchcue trace` output"
      description: |
        This command is not implemented yet in early versions.
        Redact device serials, PINs and personal paths before posting.
      render: text
  - type: dropdown
    id: result
    attributes:
      label: Observed result
      options:
        - not detected
        - detected late
        - wrong app
        - false positive
        - other
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I reviewed the output for private data
          required: true
