[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/theaifam5/touchcue"

[workspace.dependencies]
anyhow = "1.0.104"
fontdb = { version = "0.24.0", default-features = false, features = ["std", "fs", "fontconfig", "memmap"] }
freedesktop-desktop-entry = { version = "0.8.3", default-features = false }
freedesktop-icons = "0.4.0"
miette = { version = "7.6.0", default-features = false, features = ["derive"] }
png = { version = "0.18.1", default-features = false }
resvg = { version = "0.48.1", default-features = false }
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs", "event"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
skrifa = "0.48.0"
smithay-client-toolkit = { version = "0.21.1", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
tiny-skia = "0.12.0"
tokio = { version = "1.53.2", default-features = false }
tokio-util = { version = "0.7.19", default-features = false }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }
touchcue = { path = "crates/touchcue" }
touchcue-appinfo = { path = "crates/touchcue-appinfo" }
touchcue-core = { path = "crates/touchcue-core" }
touchcue-detect = { path = "crates/touchcue-detect" }
touchcue-ipc = { path = "crates/touchcue-ipc" }
touchcue-ui = { path = "crates/touchcue-ui" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi", "tracing-log"] }
usage = { package = "usage-rs", version = "6.12.0" }
x11rb = { version = "0.14.0", default-features = false, features = ["randr", "shape"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
